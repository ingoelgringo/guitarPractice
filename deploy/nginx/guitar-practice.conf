# Versionshanterad kopia av /etc/nginx/sites-available/guitar-practice på VPS:en.
# Den riktiga filen har även 443-blocket som certbot lägger till. Håll kopian i synk för hand.

server {
    server_name guitar.berghult.com;

    # Filnamnen innehåller en hash, så de kan cachas för alltid. Katalogen delas av alla releaser.
    location /_next/static/ {
        alias /home/deploy/guitar-practice/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
