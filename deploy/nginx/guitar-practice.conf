# Gitarrdelens location-block för ingemar.berghult.com, som ligger under /guitar (ADR 0004).
# Server-blocket för domänen ägs av Landningssidans repo (ingemar-berghult), som har Landningssidan
# på /, spelet på /stenhagen/ och 301 från de gamla adresserna (/tab-editor, /fretboard, /library,
# /login) till /guitar/... Blocken här klistras in där, och kopian hålls i synk för hand.
# Next bygger med basePath /guitar, så proxy_pass skickar hela sökvägen vidare (ingen URI efter porten).

# Inloggningsförsök per IP: 10 per minut med en kö på 5, sedan 429. Appen spärrar dessutom
# en IP i en kvart efter fem fel. limit_req_zone måste stå utanför server-blocket (filen
# inkluderas i http-kontexten), och zonnamnet måste vara unikt på servern.
limit_req_zone $binary_remote_addr zone=guitarpractice_login:1m rate=10r/m;

# --- inuti server { server_name ingemar.berghult.com; ... } ---

    # Filnamnen innehåller en hash, så de kan cachas för alltid. Katalogen delas av alla releaser.
    location /guitar/_next/static/ {
        alias /home/deploy/guitar-practice/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # alphaTabs typsnitt och soundfont (scripts/copy-alphatab-assets.mjs) direkt från den aktiva
    # releasen. Filnamnen saknar hash men ändras i praktiken aldrig, så de cachas i 30 dagar.
    location /guitar/alphatab/ {
        alias /home/deploy/guitar-practice/current/public/alphatab/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # alphaTabs skript startar spelarens worker och måste matcha alphaTab i bundlen,
    # så det valideras om vid varje laddning (ETag ger 304 när det är oförändrat).
    location = /guitar/alphatab/alphaTab.js {
        alias /home/deploy/guitar-practice/current/public/alphatab/alphaTab.js;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location = /guitar/api/login {
        limit_req zone=guitarpractice_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gitarrsidan ligger på /guitar utan avslutande snedstreck, och resten under /guitar/.
    location = /guitar {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /guitar/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
