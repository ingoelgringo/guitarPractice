# Versionshanterad kopia av /etc/nginx/sites-available/guitar-practice på VPS:en.
# Den riktiga filen har även 443-blocket som certbot lägger till. Håll kopian i synk för hand.

server {
    server_name ingemar.berghult.com;

    # Filnamnen innehåller en hash, så de kan cachas för alltid. Katalogen delas av alla releaser.
    location /_next/static/ {
        alias /home/deploy/guitar-practice/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # alphaTabs typsnitt och soundfont (scripts/copy-alphatab-assets.mjs) direkt från den aktiva
    # releasen. Filnamnen saknar hash men ändras i praktiken aldrig, så de cachas i 30 dagar.
    location /alphatab/ {
        alias /home/deploy/guitar-practice/current/public/alphatab/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # alphaTabs skript startar spelarens worker och måste matcha alphaTab i bundlen,
    # så det valideras om vid varje laddning (ETag ger 304 när det är oförändrat).
    location = /alphatab/alphaTab.js {
        alias /home/deploy/guitar-practice/current/public/alphatab/alphaTab.js;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
